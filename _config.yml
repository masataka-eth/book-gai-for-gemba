# GitHub Pages 標準テーマ (軽量・日本語OK)
theme: jekyll-theme-cayman

# マークダウンエンジン
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# ビルド対象から除外
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .gitignore
